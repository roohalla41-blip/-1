<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b1518" />
  <meta name="robots" content="noindex" />
  <title>حساب صراف | در حال بازگشت</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:#0b1518;color:#f4f7f3;font-family:Tahoma,Arial,sans-serif}
    main{width:min(100%,560px);padding:38px 26px;text-align:center;border:1px solid #294247;border-radius:22px;background:#122327}
    .mark{width:58px;height:58px;margin:0 auto 18px;display:grid;place-items:center;border:1px solid #8c7748;border-radius:17px;color:#d6b56d;font-size:27px;font-weight:bold}
    h1{font-size:24px;margin:12px 0}p{line-height:2;color:#afc1c1}
    a{display:inline-block;margin-top:14px;padding:11px 20px;border-radius:10px;background:#d6b56d;color:#172326;text-decoration:none;font-weight:bold}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">ح</div>
    <h1>در حال بازگشت به حساب صراف</h1>
    <p>لطفاً چند لحظه منتظر بمانید. نشانی درخواستی در حال بررسی است.</p>
    <a href="/">رفتن به صفحه اصلی</a>
  </main>
  <script>
    // Preserve client-side routes while showing a branded fallback instead of a raw host error.
    (function () {
      var requestedPath = window.location.pathname + window.location.search + window.location.hash;
      var target = '/?__spa_path=' + encodeURIComponent(requestedPath);
      window.location.replace(target);
    })();
  </script>
</body>
</html>
