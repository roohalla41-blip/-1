name: Deploy isolated audit preview

on:
  push:
    branches: [audit/replace-base44-core]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: audit-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: audit/replace-base44-core
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build preview
        run: npm run build
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
