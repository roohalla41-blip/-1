name: Deploy built live Supabase preview
# Publishes the Vite build output, never raw JSX source files.
# This preview connects to the existing Supabase project; avoid destructive/financial tests.

on:
  push:
    branches: [audit/replace-base44-core]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: release-preview-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out live Supabase preview source
        uses: actions/checkout@v4
        with:
          ref: preview/live-supabase-pages

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build the production website with Vite
        run: npm run build

      - name: Verify built assets and runtime configuration
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html || { echo "ERROR: Vite did not produce dist/index.html"; exit 1; }
          test -s dist/runtime-config.js || { echo "ERROR: Supabase runtime-config.js is missing from dist"; exit 1; }
          test -d dist/assets || { echo "ERROR: dist/assets is missing; raw source must not be published"; exit 1; }
          find dist/assets -maxdepth 1 -type f -name '*.js' -print -quit | grep -q . || { echo "ERROR: no built JavaScript bundles found"; exit 1; }
          grep -Eq 'assets/[^"]+\.js' dist/index.html || { echo "ERROR: dist/index.html does not reference a built JavaScript bundle"; exit 1; }
          if grep -q 'src/main.jsx' dist/index.html; then
            echo "ERROR: raw JSX entry is still referenced; refusing to deploy."
            exit 1
          fi

      - name: Add fallback for direct navigation to app routes
        run: cp dist/index.html dist/404.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload only the verified build output
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
