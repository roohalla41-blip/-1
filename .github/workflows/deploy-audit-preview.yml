name: Deploy isolated UI preview through allowed Pages branch
# GitHub Pages environment currently permits deployment from audit/replace-base44-core.
# Build the isolated preview branch while keeping the authorized deployment ref.
# The preview branch uses fake local-demo auth and never connects to real Supabase. Mobile language selector fix deployment.

on:
  push:
    branches: [audit/replace-base44-core]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: release-preview-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout isolated UI preview (not production)
        uses: actions/checkout@v4
        with:
          ref: preview/restore-ui

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build isolated UI preview
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload built website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/

      - name: Publish isolated preview
        id: deployment
        uses: actions/deploy-pages@v4
