name: Deploy live Supabase-connected preview through allowed Pages branch
# Final verification run after route and live-preview safety fixes.
# Rebuild after password-reset path fix.
# Rebuild after service-worker base-path fix.
# Rebuild after Supabase timeout and CRUD safeguards.
# GitHub Pages environment currently permits deployment from audit/replace-base44-core.
# Build a dedicated preview branch based on the release candidate, with the real Supabase browser config.
# This is a live-data preview: avoid destructive or financial write operations during testing.
# Route fallback: publish dist/404.html so BrowserRouter routes such as /-1/login load the SPA.

on:
  push:
    branches: [audit/replace-base44-core]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: release-preview-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout live Supabase preview branch
        uses: actions/checkout@v4
        with:
          ref: preview/live-supabase-pages

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build live Supabase-connected preview
        run: npm run build

      - name: Add SPA fallback for nested routes on GitHub Pages
        run: cp dist/index.html dist/404.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload built website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/

      - name: Publish isolated preview
        id: deployment
        uses: actions/deploy-pages@v4
