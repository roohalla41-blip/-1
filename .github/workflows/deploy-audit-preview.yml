name: Deploy release preview through allowed audit branch
# Trigger refresh: publish latest release source after startup overlay fix 2

on:
  push:
    branches: [audit/replace-base44-core]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: release-preview-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout release candidate
        uses: actions/checkout@v4
        with:
          ref: release/restore-build
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build release preview
        run: npm run build
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/
      - name: Publish release preview
        id: deployment
        uses: actions/deploy-pages@v4
