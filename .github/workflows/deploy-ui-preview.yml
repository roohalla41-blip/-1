name: Build isolated UI preview

on:
  push:
    branches:
      - preview/restore-ui
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: isolated-ui-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated preview branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build isolated UI preview
        run: npm run build

      - name: Upload built preview
        uses: actions/upload-artifact@v4
        with:
          name: hesab-sarraf-preview-dist
          path: dist/
          if-no-files-found: error
