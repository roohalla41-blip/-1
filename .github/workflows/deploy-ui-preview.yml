name: Build isolated UI preview

on:
  push:
    branches:
      - preview/restore-ui
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: isolated-ui-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated preview branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build isolated UI preview
        run: npm run build

      - name: Upload built preview
        uses: actions/upload-artifact@v4
        with:
          name: hesab-sarraf-preview-dist
          path: dist/
          if-no-files-found: error

      - name: Publish compiled preview as a non-production Netlify deploy
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          npx --yes netlify-cli deploy \
            --dir=dist \
            --site=e63e3c14-d73f-4397-ad78-3b810b4e43a2 \
            --auth="$NETLIFY_AUTH_TOKEN" \
            --message="Isolated UI preview - compiled Vite build"
