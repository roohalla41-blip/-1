name: Build independent test
on:
  workflow_dispatch:
  push:
    branches: [rebuild/independent-test-app]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: hesab-sarraf-web-build
          path: dist/
          if-no-files-found: error
