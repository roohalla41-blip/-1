name: Validate A1 integration branch

on:
  push:
    branches:
      - integration/preview-core-2026-11-10
  pull_request:
    branches:
      - release/restore-build
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: a1-integration-validation
  cancel-in-progress: false

jobs:
  build-only:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies (repository has no committed lockfile)
        run: npm install --no-audit --no-fund --no-package-lock
      - name: Verify existing A1 RBAC behavior
        run: node --test tests/a1-rbac-baseline.test.js
      - name: Build without deployment
        run: npm run build
      - name: Upload build artifact for review
        uses: actions/upload-artifact@v4
        with:
          name: a1-integration-review-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
