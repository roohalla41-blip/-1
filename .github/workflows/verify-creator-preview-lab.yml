name: Build creator preview lab (no deployment)

on:
  push:
    branches:
      - feature/creator-preview-lab-2026-10-30
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: creator-preview-lab-build
  cancel-in-progress: true

jobs:
  build-preview-only:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this feature branch only
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build the preview app
        run: npm run build

      - name: Store preview build artifact
        uses: actions/upload-artifact@v4
        with:
          name: creator-preview-lab-build
          path: dist/
          if-no-files-found: error
          retention-days: 7
