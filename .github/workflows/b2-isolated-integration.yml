name: B2 isolated integration build

on:
  push:
    branches:
      - test/b2-integration
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: b2-isolated-integration
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out isolated B2 test branch
        uses: actions/checkout@v4
        with:
          ref: test/b2-integration

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build isolated test app
        run: npm run build

      - name: Upload test build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hesab-sarraf-b2-test-build
          path: dist/
          if-no-files-found: error
          retention-days: 7
