name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/android-apk
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout A1
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install web dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Build web app
        run: npm run build

      - name: Prepare Capacitor Android wrapper
        run: |
          npm install --no-save @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap add android
          npx cap sync android

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Sign APK when signing secrets are configured
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEY_PASSWORD != '' }}
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/a1-signing.jks"
          APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/a1-signing.jks" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
            --key-pass "pass:$ANDROID_KEY_PASSWORD" \
            --out android/app/build/outputs/apk/release/hesab-sarraf-release.apk \
            "$APK"
          "$BUILD_TOOLS/apksigner" verify --verbose android/app/build/outputs/apk/release/hesab-sarraf-release.apk
          rm -f "$RUNNER_TEMP/a1-signing.jks"

      - name: Prepare artifact
        run: |
          mkdir -p artifacts
          if [ -f android/app/build/outputs/apk/release/hesab-sarraf-release.apk ]; then
            cp android/app/build/outputs/apk/release/hesab-sarraf-release.apk artifacts/
          else
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk artifacts/hesab-sarraf-unsigned.apk
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hesab-sarraf-android-apk
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 14
