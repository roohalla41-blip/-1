<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Resolve app assets correctly on both GitHub project Pages and a root custom domain. -->
    <base id="app-base" href="/" />
    <script>
      (() => {
        const base = document.getElementById('app-base');
        if (!base) return;
        const host = window.location.hostname.toLowerCase();
        const path = window.location.pathname;
        const isGitHubProjectPage =
          host === 'roohalla41-blip.github.io' &&
          (path === '/-1' || path.startsWith('/-1/'));
        base.href = isGitHubProjectPage ? '/-1/' : '/';
      })();
    </script>
    <meta name="theme-color" content="#0f766e" />
    <meta name="description" content="حساب صراف" />
    <meta name="google-site-verification" content="AMT3JOsH7VCbxfEcKeVq3QIjxmZUQ886AJhfuXYGvxE" />
    <title>حساب صراف</title>
    <!-- Keep the app shell fresh: retire stale service workers scoped to this GitHub Pages app. -->
    <script>
      (() => {
        if (!('serviceWorker' in navigator)) return;
        const appPath = new URL('./', window.location.href).pathname;
        const reloadKey = 'hisabsarraf-sw-refresh-v1';
        navigator.serviceWorker.getRegistrations().then((registrations) => {
          const stale = registrations.filter((registration) => {
            const scopePath = new URL(registration.scope).pathname;
            return scopePath === appPath || scopePath.startsWith(appPath);
          });
          if (!stale.length) return;
          Promise.all(stale.map((registration) => registration.unregister())).then(() => {
            if (sessionStorage.getItem(reloadKey) === '1') return;
            sessionStorage.setItem(reloadKey, '1');
            window.location.reload();
          });
        }).catch(() => {});
      })();
    </script>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <script src="./runtime-config.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-fallback" style="position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;padding:24px;background:#101318;color:#f4edd8;font-family:Tahoma,Arial,sans-serif;text-align:center;line-height:2">
      <div>
        <div style="font-size:24px;font-weight:700;margin-bottom:12px">حساب صراف</div>
        <div>در حال راه‌اندازی برنامه...</div>
        <div style="font-size:13px;color:#c9a24b;margin-top:12px">اگر این پیام باقی ماند، اجرای برنامه شروع نشده است.</div>
      </div>
    </div>
    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
